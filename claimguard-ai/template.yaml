AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Description: >
  claimguard-ai
  AWS SAM infrastructure for ClaimGuard AI.

Metadata:
  cfn-lint:
    config:
      ignore_checks:
        - W3660

Globals:
  Function:
    Timeout: 3
    Tracing: Active
    LoggingConfig:
      LogFormat: JSON

  Api:
    TracingEnabled: true
    Cors:
      AllowMethods: "'OPTIONS,GET,POST'"
      AllowHeaders: "'Content-Type,Authorization'"
      AllowOrigin: !Sub "'${FrontendOrigin}'"
    Auth:
      DefaultAuthorizer: CognitoAuthorizer
      AddDefaultAuthorizerToCorsPreflight: false
      Authorizers:
        CognitoAuthorizer:
          UserPoolArn: !GetAtt CognitoUserPool.Arn

Parameters:
  FrontendOrigin:
    Type: String
    Default: https://main.d2e2qy7yqilyn0.amplifyapp.com
    Description: Browser origin allowed to use the API and Cognito Hosted UI.
  CognitoDomainPrefix:
    Type: String
    Description: Globally unique Cognito Hosted UI domain prefix.

Resources:

  SubmitClaimFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: submit_claim_api/
      Handler: app.lambda_handler
      Runtime: python3.14
      Timeout: 10
      Environment:
        Variables:
          STATE_MACHINE_ARN: !Ref ClaimPipeline
          CORS_ORIGIN: !Ref FrontendOrigin
      Layers:
        - !Ref CognitoAuthLayer
      Policies:
        - StepFunctionsExecutionPolicy:
            StateMachineName: !GetAtt ClaimPipeline.Name
      Events:
        SubmitClaim:
          Type: Api
          Properties:
            Path: /claims/submit
            Method: POST

  ClaimStatusFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: claim_status_api/
      Handler: app.lambda_handler
      Runtime: python3.14
      Timeout: 10
      Environment:
        Variables:
          STATE_MACHINE_ARN: !Ref ClaimPipeline
          CORS_ORIGIN: !Ref FrontendOrigin
      Layers:
        - !Ref CognitoAuthLayer
      Policies:
        - Statement:
            - Effect: Allow
              Action: states:DescribeExecution
              Resource: !Sub "arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:execution:${ClaimPipeline.Name}:*"
      Events:
        GetStatus:
          Type: Api
          Properties:
            Path: /claims/status
            Method: GET

  AggregateResultsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: aggregate_results_api/
      Handler: app.lambda_handler
      Runtime: python3.14
      Timeout: 15
      Environment:
        Variables:
          OPERATIONAL_CLAIMS_TABLE: !Ref OperationalClaimsTable
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:UpdateItem
              Resource: !GetAtt OperationalClaimsTable.Arn

  ClaimPipeline:
    Type: AWS::Serverless::StateMachine
    Properties:
      DefinitionUri: statemachine/claim_pipeline.asl.json
      DefinitionSubstitutions:
        DuplicateCheckFunctionArn: !GetAtt DuplicateCheckFunction.Arn
        PolicyValidationFunctionArn: !GetAtt PolicyValidationFunction.Arn
        OutlierCheckFunctionArn: !GetAtt OutlierCheckFunction.Arn
        ImageForensicsFunctionArn: !GetAtt ImageForensicsFunction.Arn
        EvidenceRelevanceFunctionArn: !GetAtt EvidenceRelevanceFunction.Arn
        AggregateResultsFunctionArn: !GetAtt AggregateResultsFunction.Arn
      Policies:
        - LambdaInvokePolicy:
            FunctionName: !Ref DuplicateCheckFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref PolicyValidationFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref OutlierCheckFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref ImageForensicsFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref EvidenceRelevanceFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref AggregateResultsFunction

  CognitoUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${AWS::StackName}-users"
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      UsernameConfiguration:
        CaseSensitive: false
      Schema:
        - Name: email
          AttributeDataType: String
          Mutable: true
          Required: true

  CognitoUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Ref CognitoDomainPrefix
      UserPoolId: !Ref CognitoUserPool

  CognitoUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub "${AWS::StackName}-frontend"
      UserPoolId: !Ref CognitoUserPool
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - openid
        - email
        - profile
      SupportedIdentityProviders:
        - COGNITO
      CallbackURLs:
        - !Ref FrontendOrigin
      LogoutURLs:
        - !Ref FrontendOrigin
      PreventUserExistenceErrors: ENABLED

  AdjusterUserGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: adjuster
      Description: Insurance adjusters who can review all claims.
      UserPoolId: !Ref CognitoUserPool

  ClaimantUserGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: claimant
      Description: Claimants who can submit and view their own claims.
      UserPoolId: !Ref CognitoUserPool

  CognitoAuthLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub "${AWS::StackName}-cognito-auth"
      ContentUri: shared_auth/
      CompatibleRuntimes:
        - python3.14
      RetentionPolicy: Retain

  UnauthorizedGatewayResponse:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      RestApiId: !Ref ServerlessRestApi
      ResponseType: UNAUTHORIZED
      StatusCode: "401"
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: !Sub "'${FrontendOrigin}'"
        gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"
        gatewayresponse.header.Access-Control-Allow-Methods: "'OPTIONS,GET,POST'"
      ResponseTemplates:
        application/json: '{"error":"Unauthorized"}'

  AccessDeniedGatewayResponse:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      RestApiId: !Ref ServerlessRestApi
      ResponseType: ACCESS_DENIED
      StatusCode: "403"
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: !Sub "'${FrontendOrigin}'"
        gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"
        gatewayresponse.header.Access-Control-Allow-Methods: "'OPTIONS,GET,POST'"
      ResponseTemplates:
        application/json: '{"error":"Forbidden"}'

  # --------------------------------------------------

  # S3 CLAIM DOCUMENT STORAGE

  # --------------------------------------------------



  ClaimPacketsBucket:

    Type: AWS::S3::Bucket

    Properties:

      BucketEncryption:

        ServerSideEncryptionConfiguration:

          - ServerSideEncryptionByDefault:

              SSEAlgorithm: AES256



      PublicAccessBlockConfiguration:

        BlockPublicAcls: true

        IgnorePublicAcls: true

        BlockPublicPolicy: true

        RestrictPublicBuckets: true



      NotificationConfiguration:

        EventBridgeConfiguration:

          EventBridgeEnabled: true



      CorsConfiguration:
        CorsRules:
          - AllowedOrigins:
              - !Ref FrontendOrigin
            AllowedMethods:
              - PUT
            AllowedHeaders:
              - Content-Type
              - x-amz-meta-userid

            ExposedHeaders:

              - ETag

            MaxAge: 3000



  # --------------------------------------------------

  # PRESIGNED UPLOAD LAMBDA

  # --------------------------------------------------



  PresignUploadFunction:

    Type: AWS::Serverless::Function

    Properties:

      CodeUri: upload_api/

      Handler: app.lambda_handler

      Runtime: python3.14

      Timeout: 10



      Environment:
        Variables:
          CLAIM_PACKETS_BUCKET: !Ref ClaimPacketsBucket
          CORS_ORIGIN: !Ref FrontendOrigin
      Layers:
        - !Ref CognitoAuthLayer



      Policies:

        - S3WritePolicy:
            BucketName: !Ref ClaimPacketsBucket



      Events:

        CreateUploadUrl:

          Type: Api

          Properties:

            Path: /uploads/presign

            Method: post



  # --------------------------------------------------

  # REFERENCE CLAIMS TABLE

  # --------------------------------------------------



  ReferenceClaimsTable:

    Type: AWS::DynamoDB::Table

    Properties:

      TableName: ClaimGuardReferenceClaims

      BillingMode: PAY_PER_REQUEST



      AttributeDefinitions:
        - AttributeName: claimId
          AttributeType: S
        - AttributeName: policyNumber
          AttributeType: S
        - AttributeName: incidentDate

          AttributeType: S



      KeySchema:

        - AttributeName: claimId

          KeyType: HASH



      GlobalSecondaryIndexes:
        - IndexName: PolicyNumberIncidentDateIndex

          KeySchema:

            - AttributeName: policyNumber

              KeyType: HASH

            - AttributeName: incidentDate

              KeyType: RANGE

          Projection:

            ProjectionType: ALL



  # --------------------------------------------------

  # REFERENCE POLICIES TABLE

  # --------------------------------------------------



  ReferencePoliciesTable:

    Type: AWS::DynamoDB::Table

    Properties:

      TableName: ClaimGuardReferencePolicies

      BillingMode: PAY_PER_REQUEST



      AttributeDefinitions:

        - AttributeName: policyNumber

          AttributeType: S



      KeySchema:

        - AttributeName: policyNumber

          KeyType: HASH



  # --------------------------------------------------

  # POLICY VALIDATION LAMBDA

  # --------------------------------------------------



  PolicyValidationFunction:

    Type: AWS::Serverless::Function

    Properties:

      CodeUri: policy_validation_api/

      Handler: app.lambda_handler

      Runtime: python3.14

      Timeout: 10



      Environment:
        Variables:
          POLICIES_TABLE: !Ref ReferencePoliciesTable
          CORS_ORIGIN: !Ref FrontendOrigin


      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ReferencePoliciesTable



      Events:

        ValidatePolicy:

          Type: Api

          Properties:

            Path: /claims/validate

            Method: POST



  # --------------------------------------------------

  # OPERATIONAL CLAIMS TABLE

  # --------------------------------------------------



  OperationalClaimsTable:

    Type: AWS::DynamoDB::Table

    Properties:

      TableName: ClaimGuardOperationalClaims

      BillingMode: PAY_PER_REQUEST



      AttributeDefinitions:

        - AttributeName: claimId

          AttributeType: S

        - AttributeName: userId

          AttributeType: S

        - AttributeName: policyNumber

          AttributeType: S

        - AttributeName: incidentDate

          AttributeType: S



      KeySchema:

        - AttributeName: claimId

          KeyType: HASH



      GlobalSecondaryIndexes:

        - IndexName: UserIdIndex

          KeySchema:

            - AttributeName: userId

              KeyType: HASH

            - AttributeName: incidentDate

              KeyType: RANGE

          Projection:

            ProjectionType: ALL

        - IndexName: PolicyNumberIncidentDateIndex

          KeySchema:

            - AttributeName: policyNumber

              KeyType: HASH

            - AttributeName: incidentDate

              KeyType: RANGE

          Projection:

            ProjectionType: ALL



  # --------------------------------------------------

  # IMAGE HASHES TABLE

  # --------------------------------------------------



  ImageHashesTable:

    Type: AWS::DynamoDB::Table

    Properties:

      TableName: ClaimGuardImageHashes

      BillingMode: PAY_PER_REQUEST



      AttributeDefinitions:

        - AttributeName: imageId

          AttributeType: S

        - AttributeName: claimId

          AttributeType: S



      KeySchema:

        - AttributeName: imageId

          KeyType: HASH



      GlobalSecondaryIndexes:

        - IndexName: ClaimIdIndex

          KeySchema:

            - AttributeName: claimId

              KeyType: HASH

          Projection:

            ProjectionType: ALL



  # --------------------------------------------------

  # DUPLICATE CHECK LAMBDA

  # --------------------------------------------------



  DuplicateCheckFunction:

    Type: AWS::Serverless::Function

    Properties:

      CodeUri: duplicate_check_api/

      Handler: app.lambda_handler

      Runtime: python3.14

      Timeout: 30

      MemorySize: 512



      Environment:
        Variables:
          REFERENCE_CLAIMS_TABLE: !Ref ReferenceClaimsTable
          OPERATIONAL_CLAIMS_TABLE: !Ref OperationalClaimsTable
          IMAGE_HASHES_TABLE: !Ref ImageHashesTable
          CLAIM_PACKETS_BUCKET: !Ref ClaimPacketsBucket
          CORS_ORIGIN: !Ref FrontendOrigin
      Layers:
        - !Ref CognitoAuthLayer



      Policies:

        - DynamoDBReadPolicy:

            TableName: !Ref ReferenceClaimsTable



        - DynamoDBCrudPolicy:

            TableName: !Ref OperationalClaimsTable



        - DynamoDBCrudPolicy:

            TableName: !Ref ImageHashesTable



        - Statement:

            - Sid: ReadUploadedClaimImages

              Effect: Allow

              Action:

                - s3:GetObject

              Resource: !Sub "${ClaimPacketsBucket.Arn}/incoming/*"



      Events:

        CheckDuplicate:

          Type: Api

          Properties:

            Path: /claims/check-duplicate

            Method: POST



  # --------------------------------------------------

  # FETCH CLAIMS HISTORY LAMBDA

  # --------------------------------------------------



  FetchClaimsFunction:

    Type: AWS::Serverless::Function

    Properties:

      CodeUri: fetch_claims_api/

      Handler: app.lambda_handler

      Runtime: python3.14

      Timeout: 15

      MemorySize: 256



      Environment:
        Variables:
          OPERATIONAL_CLAIMS_TABLE: !Ref OperationalClaimsTable
          CORS_ORIGIN: !Ref FrontendOrigin
      Layers:
        - !Ref CognitoAuthLayer



      Policies:

        - DynamoDBReadPolicy:

            TableName: !Ref OperationalClaimsTable



      Events:
        FetchClaims:
          Type: Api
          Properties:
            Path: /claims/history
            Method: GET

  SaveClaimResultsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: save_claim_results_api/
      Handler: app.lambda_handler
      Runtime: python3.14
      Timeout: 10
      Environment:
        Variables:
          OPERATIONAL_CLAIMS_TABLE: !Ref OperationalClaimsTable
          CORS_ORIGIN: !Ref FrontendOrigin
      Layers:
        - !Ref CognitoAuthLayer
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:UpdateItem
              Resource: !GetAtt OperationalClaimsTable.Arn
      Events:
        SaveClaimResults:
          Type: Api
          Properties:
            Path: /claims/screening-results
            Method: POST

  # --------------------------------------------------

  # OUTLIER DETECTION LAMBDA

  # --------------------------------------------------



  OutlierCheckFunction:

    Type: AWS::Serverless::Function

    Properties:

      CodeUri: outlier_check_api/

      Handler: app.lambda_handler

      Runtime: python3.14

      Timeout: 10



      Environment:
        Variables:
          REFERENCE_CLAIMS_TABLE: !Ref ReferenceClaimsTable
          CORS_ORIGIN: !Ref FrontendOrigin


      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ReferenceClaimsTable



      Events:

        CheckOutlier:

          Type: Api

          Properties:

            Path: /claims/check-outlier

            Method: POST



  # --------------------------------------------------

  # DOCUMENT EXTRACTION LAMBDA

  # --------------------------------------------------



  DocumentExtractionFunction:

    Type: AWS::Serverless::Function

    Properties:

      CodeUri: document_extraction_api/

      Handler: app.lambda_handler

      Runtime: python3.14

      Timeout: 60

      MemorySize: 512



      Environment:
        Variables:
          CLAIM_PACKETS_BUCKET: !Ref ClaimPacketsBucket
          BEDROCK_MODEL_ID: amazon.nova-lite-v1:0
          CORS_ORIGIN: !Ref FrontendOrigin
      Layers:
        - !Ref CognitoAuthLayer



      Policies:

        - Statement:

            - Sid: ReadUploadedClaimDocuments

              Effect: Allow

              Action:

                - s3:GetObject

                - s3:GetObjectVersion

              Resource: !Sub "${ClaimPacketsBucket.Arn}/incoming/*"



            - Sid: InvokeNovaLite

              Effect: Allow

              Action:

                - bedrock:InvokeModel

              Resource: !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/amazon.nova-lite-v1:0"



      Events:

        ExtractDocument:

          Type: Api

          Properties:

            Path: /claims/extract-document

            Method: POST



  # --------------------------------------------------

  # IMAGE FORENSICS LAMBDA (CONTAINER IMAGE — Smaug runs locally)

  # --------------------------------------------------



  ImageForensicsFunction:

    Type: AWS::Serverless::Function

    Properties:

      PackageType: Image

      Timeout: 300
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins:
            - !Ref FrontendOrigin
          AllowMethods:
            - POST
          AllowHeaders:
            - content-type
            - authorization
          MaxAge: 3000

      MemorySize: 3008

      EphemeralStorage:

        Size: 1024

      ImageConfig:

        Command:

          - app.lambda_handler



      Environment:

        Variables:

          CLAIM_PACKETS_BUCKET: !Ref ClaimPacketsBucket

          MAX_IMAGES_PER_CLAIM: "2"

          MAX_IMAGE_BYTES: "10485760"

          CORS_ORIGIN: !Ref FrontendOrigin

          USER_POOL_ID: !Ref CognitoUserPool

          USER_POOL_CLIENT_ID: !Ref CognitoUserPoolClient

          OPERATIONAL_CLAIMS_TABLE: !Ref OperationalClaimsTable

          SMAUG_MIN_REMAINING_TIME_MS: "20000"

          HF_HUB_OFFLINE: "1"



      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref OperationalClaimsTable
        - Statement:

            - Sid: ReadUploadedImagesForForensics

              Effect: Allow

              Action:

                - s3:GetObject

              Resource: !Sub "${ClaimPacketsBucket.Arn}/incoming/*"



      Events:

        AnalyzeClaimImages:

          Type: Api

          Properties:

            Path: /claims/analyze-image

            Method: POST



    Metadata:

      Dockerfile: Dockerfile

      DockerContext: image_forensics_api

      DockerTag: latest



  # --------------------------------------------------

  # EVIDENCE RELEVANCE LAMBDA

  # --------------------------------------------------



  EvidenceRelevanceFunction:

    Type: AWS::Serverless::Function

    Properties:

      CodeUri: evidence_relevance_api/

      Handler: app.lambda_handler

      Runtime: python3.14

      Timeout: 29

      MemorySize: 512



      Environment:
        Variables:
          CLAIM_PACKETS_BUCKET: !Ref ClaimPacketsBucket
          BEDROCK_MODEL_ID: amazon.nova-lite-v1:0
          CORS_ORIGIN: !Ref FrontendOrigin

      Layers:
        - !Ref CognitoAuthLayer


      Policies:
        - Statement:

            - Sid: ReadUploadedClaimEvidence

              Effect: Allow

              Action:

                - s3:GetObject

              Resource: !Sub "${ClaimPacketsBucket.Arn}/incoming/*"



            - Sid: InvokeNovaLiteDirect

              Effect: Allow

              Action:

                - bedrock:InvokeModel

              Resource: !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/amazon.nova-lite-v1:0"



      Events:

        ValidateEvidence:

          Type: Api

          Properties:

            Path: /claims/validate-evidence

            Method: POST



Outputs:



  ValidateEvidenceApi:

    Description: Endpoint for evidence relevance validation using Amazon Bedrock

    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/Prod/claims/validate-evidence"



  ClaimPacketsBucketName:

    Description: S3 bucket for uploaded insurance claim packets

    Value: !Ref ClaimPacketsBucket



  PresignUploadApi:

    Description: Endpoint for requesting a short-lived S3 upload URL

    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/Prod/uploads/presign"



  ReferenceClaimsTableName:

    Description: DynamoDB table for synthetic reference claims

    Value: !Ref ReferenceClaimsTable



  ReferencePoliciesTableName:

    Description: DynamoDB table for synthetic reference policies

    Value: !Ref ReferencePoliciesTable



  OperationalClaimsTableName:

    Description: DynamoDB table for operational claim submissions

    Value: !Ref OperationalClaimsTable



  ImageHashesTableName:

    Description: DynamoDB table for image fingerprints

    Value: !Ref ImageHashesTable



  OutlierCheckApi:

    Description: Endpoint for statistical claim-amount outlier detection

    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/Prod/claims/check-outlier"

  ImageForensicsUrl:
    Description: Direct Lambda Function URL for image forensics (no 29s limit)
    Value: !GetAtt ImageForensicsFunctionUrl.FunctionUrl

  CognitoUserPoolId:
    Description: Cognito user pool ID
    Value: !Ref CognitoUserPool

  CognitoUserPoolClientId:
    Description: Cognito public app client ID
    Value: !Ref CognitoUserPoolClient

  CognitoHostedUiDomain:
    Description: Cognito Hosted UI domain
    Value: !Sub "${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com"

  ClaimsHistoryApi:
    Description: Authenticated paginated claims history endpoint
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/Prod/claims/history"

  SaveClaimResultsApi:
    Description: Authenticated endpoint for persisting claim screening results
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/Prod/claims/screening-results"
