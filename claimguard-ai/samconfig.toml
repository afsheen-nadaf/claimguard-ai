parameter_overrides = "FrontendOrigin=\"https://main.d2e2qy7yqilyn0.amplifyapp.com/" CognitoDomainPrefix=\"claimguard-ai\""

[default.package.parameters]
resolve_s3 = true

[default.sync.parameters]
watch = true

[default.local_start_api.parameters]
